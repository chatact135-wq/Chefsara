{% block extra_js %}
<script>
    let currentSelectedPrice = {{ product.price|default:"0" }};
    let currentSelectedSizeLabel = '';
    let currentMaxStock = {{ product.inventory_stock|default:"10" }};

    document.addEventListener("DOMContentLoaded", function() {
        let firstSizeBtn = document.querySelector('.size-btn');
        if (firstSizeBtn) selectSize(firstSizeBtn);
    });

    function openLightbox() {
        let activeImgEl = document.getElementById('activeImage');
        if(activeImgEl) {
            document.getElementById('lightboxImgTarget').src = activeImgEl.src;
            document.getElementById('imageLightbox').style.display = 'flex';
        }
    }
    function closeLightbox() { document.getElementById('imageLightbox').style.display = 'none'; }

    function switchTab(evt, tabId) {
        document.querySelectorAll('.tab-content-pane').forEach(p => p.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        evt.currentTarget.classList.add('active');
    }

    function toggleReadMore() {
        let container = document.getElementById('descTextContainer');
        let btn = document.getElementById('readMoreBtn');
        if (container.classList.contains('desc-preview')) {
            container.classList.remove('desc-preview');
            btn.textContent = '{% if request.GET.lang == "ar" %}قراءة أقل{% else %}Read Less{% endif %}';
        } else {
            container.classList.add('desc-preview');
            btn.textContent = '{% if request.GET.lang == "ar" %}قراءة المزيد{% else %}Read More{% endif %}';
        }
    }

    function switchImage(url, index) {
        document.getElementById('activeImage').src = url;
        document.querySelectorAll('.thumbnail').forEach((thumb, i) => thumb.classList.toggle('active', i === index));
    }

    function selectSize(btn) {
        document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSelectedPrice = parseFloat(btn.getAttribute('data-price'));
        currentSelectedSizeLabel = btn.getAttribute('data-size-label');
        currentMaxStock = parseInt(btn.getAttribute('data-stock'));
        document.getElementById('displayPrice').textContent = '{% if request.GET.lang == "ar" %}' + currentSelectedPrice.toFixed(2) + ' درهم{% else %}AED ' + currentSelectedPrice.toFixed(2) + '{% endif %}';
        document.getElementById('detailQty').textContent = '1';
    }

    function adjustQty(delta) {
        let qtyEl = document.getElementById('detailQty');
        let val = parseInt(qtyEl.textContent) + delta;
        if (val >= 1 && val <= currentMaxStock) qtyEl.textContent = val;
    }

    function addSelectedProductToCart() {
        let qty = parseInt(document.getElementById('detailQty').textContent);
        let baseName = "{% if request.GET.lang == 'ar' and product.name_ar %}{{ product.name_ar|escapejs }}{% else %}{{ product.name|escapejs }}{% endif %}";
        let displayName = currentSelectedSizeLabel ? `${baseName} (${currentSelectedSizeLabel})` : baseName;
        
        // Directly reference the global cart array loaded from base.html
        let existing = cart.find(i => i.name === displayName);

        if (existing) {
            if (existing.quantity + qty > currentMaxStock) {
                alert("{% if request.GET.lang == 'ar' %}الحد الأقصى للمخزون{% else %}Stock limit reached{% endif %}");
                return;
            }
            existing.quantity += qty;
        } else {
            cart.push({ name: displayName, price: currentSelectedPrice, quantity: qty });
        }
        
        // Call the save and update functions shared globally from base.html
        saveCart();
        updateCartUI();
        toggleCart();
    }
</script>
{% endblock %}
